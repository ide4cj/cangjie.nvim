name: CI

# The plugin against cjls (cjls's D32): the pinned release and the nightly — or cjls's build of this
# branch's name when cjls has one — on Neovim stable and nightly. Every day too, when a failure
# opens an issue.
on:
  push:
    branches: [master]
  pull_request:
  schedule:
    - cron: "0 5 * * *" # after cjls's nightly
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  commits:
    name: Conventional commits
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      # a rebase merge puts each commit on master
      - uses: cocogitto/cocogitto-action@v4
        with:
          command: check
          args: ${{ github.event.pull_request.base.sha }}..${{ github.event.pull_request.head.sha }}
      # a squash merge makes the title the commit on master
      - name: Check the PR title
        env:
          TITLE: ${{ github.event.pull_request.title }}
        run: cog verify "$TITLE"

  test:
    name: Test (${{ matrix.os }}, Neovim ${{ matrix.nvim }}, cjls ${{ matrix.cjls }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, ubuntu-latest, windows-latest]
        nvim: [stable, nightly]
        cjls: [pin]
        include:
          - { os: macos-latest, nvim: stable, cjls: nightly }
          - { os: ubuntu-latest, nvim: stable, cjls: nightly }
          - { os: windows-latest, nvim: stable, cjls: nightly }
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: ${{ matrix.nvim }}

      # cjfmt comes with the Cangjie SDK: the nightly cjls builds with, installed by cjls's own script
      - uses: actions/checkout@v7
        with:
          repository: ide4cj/cjls
          path: .cjls
          sparse-checkout: |
            .cangjie-version
            .github/actions/setup-cangjie
      - id: cangjie
        run: echo "tag=$(tr -d '[:space:]' < .cjls/.cangjie-version)" >> "$GITHUB_OUTPUT"
        shell: bash
      - uses: actions/cache@v6
        with:
          path: ${{ runner.temp }}/cangjie
          key: cangjie-${{ runner.os }}-${{ runner.arch }}-${{ steps.cangjie.outputs.tag }}
      - uses: actions/setup-python@v7
        with:
          python-version: "3.12"
      # only CANGJIE_HOME, not the environment envsetup makes: the plugin has to find cjfmt and run
      # it the way an editor started from a desktop would
      - name: Cangjie SDK
        run: |
          GITHUB_ENV= GITHUB_PATH= python .cjls/.github/actions/setup-cangjie/setup.py "${{ steps.cangjie.outputs.tag }}" "$RUNNER_TEMP/cangjie" > /dev/null
          echo "CANGJIE_HOME=$RUNNER_TEMP/cangjie/cangjie" >> "$GITHUB_ENV"
        shell: bash

      # cjls's build of this branch's name, when cjls has one (a change made in both)
      - id: paired
        uses: ide4cj/.github/actions/cjls@master
        with:
          releases: false
      # else the pinned release or the nightly, by the plugin's own installer; until there is one,
      # the server is not started
      - name: cjls
        env:
          PAIRED: ${{ steps.paired.outputs.path }}
          VERSION: ${{ matrix.cjls == 'nightly' && 'nightly' || '' }}
        run: |
          if [ -n "$PAIRED" ]; then
            echo "CJLS_BIN=$PAIRED" >> "$GITHUB_ENV"
          elif bin=$(nvim --clean --headless -l test/install_cjls.lua "$RUNNER_TEMP/cjls" ${VERSION:+"$VERSION"}); then
            echo "CJLS_BIN=$bin" >> "$GITHUB_ENV"
          else
            echo "::notice::no cjls release to download: the server is not started"
          fi
        shell: bash

      - run: nvim --clean --headless -u test/run.lua
        shell: bash

  # a red daily run is an issue, one at a time: the Monday triage starts from those
  report:
    name: Report the daily run
    needs: test
    if: failure() && github.event_name == 'schedule'
    runs-on: ubuntu-latest
    permissions:
      issues: write
    env:
      GH_TOKEN: ${{ github.token }}
      RUN: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
    steps:
      - run: |
          title="The daily run against cjls nightly failed"
          open=$(gh issue list --repo "$GITHUB_REPOSITORY" --state open --search "\"$title\" in:title" --json number --jq '.[0].number // empty')
          if [ -n "$open" ]; then
            gh issue comment "$open" --repo "$GITHUB_REPOSITORY" --body "Failed again: $RUN"
          else
            gh issue create --repo "$GITHUB_REPOSITORY" --title "$title" --type Bug --label S-needs-triage --body "$RUN"
          fi
