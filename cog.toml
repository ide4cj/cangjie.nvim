ignore_merge_commits = true
ignore_fixup_commits = true

# `cog bump` on master (bump.yml): the changelog and the tag, then release.yml. The plugin has no
# version of its own to write: a plugin manager takes the tag (`version = '*'` in lazy.nvim).
tag_prefix = "v"
branch_whitelist = ["master"]
post_bump_hooks = [
    "git push",
    "git push origin v{{version}}",
]

[changelog]
path = "CHANGELOG.md"
template = "remote"
remote = "github.com"
owner = "ide4cj"
repository = "cangjie.nvim"
